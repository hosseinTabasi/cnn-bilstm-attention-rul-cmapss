# Default experiment configuration — CNN–BiLSTM–Attention RUL on C-MAPSS
dataset:
  name: CMAPSS
  subset: FD001
  data_dir: data/raw
  processed_dir: data/processed
  r_early: 125          # piecewise RUL cap
  use_piecewise: true
  sensors: null         # null = use useful sensors per subset
  sequence_length: 30   # L
  horizons: [1, 5, 10]
  fail_in_30: false
  synthetic_fallback: true

model:
  name: CNN_BiLSTM_Attention
  input_dim: null       # set from data
  hidden_dim: 64
  num_layers: 2
  cnn_channels: [32, 64]
  cnn_kernel_size: 3
  dropout: 0.3
  bidirectional: true
  attention: true

training:
  batch_size: 64
  epochs: 40
  lr: 0.001
  weight_decay: 1.0e-5
  seed: 42
  num_workers: 0
  device: cpu
  early_stopping_patience: 10
  val_ratio: 0.2        # fraction of train engines for validation

evaluation:
  metrics: [rmse, mae, score]
  save_predictions: true
