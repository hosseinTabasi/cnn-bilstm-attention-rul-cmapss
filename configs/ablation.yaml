# Ablation study config
dataset:
  name: CMAPSS
  subset: FD001
  data_dir: data/raw
  processed_dir: data/processed
  r_early: 125
  use_piecewise: true
  sequence_length: 30
  horizons: [1]
  fail_in_30: false
  synthetic_fallback: true
model:
  hidden_dim: 64
  num_layers: 2
  cnn_channels: [32, 64]
  cnn_kernel_size: 3
  dropout: 0.3
training:
  batch_size: 64
  epochs: 30
  lr: 0.001
  weight_decay: 1.0e-5
  seed: 42
  device: cpu
  early_stopping_patience: 8
  val_ratio: 0.2
